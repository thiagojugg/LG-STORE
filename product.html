<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f3f1">
  <meta name="description" content="Detalhes do produto — L&G STORE.">
  <title>Detalhes do produto — L&G STORE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
  <style>
    body{min-height:100vh}.details-page-header{height:76px;padding:0 8%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.details-page-header a:first-child{font:900 34px/.8 var(--display);letter-spacing:-2px}.details-page-header small{display:block;font:700 8px var(--body);letter-spacing:4px;margin-top:6px}.details-page-header span{font-size:8px;letter-spacing:1.5px;color:#777}.product-detail-page{padding:28px 8% 90px}.details-back{border:0;background:none;padding:10px 0 25px;font:700 9px var(--body);letter-spacing:1px;cursor:pointer}.detail-page-layout{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(300px,.85fr);gap:6%;align-items:start}.detail-main-image{width:100%;aspect-ratio:4/4.7;object-fit:cover;background:#ddd;display:block}.detail-gallery{position:relative;overflow:hidden;touch-action:pan-y;user-select:none}.detail-main-image{cursor:grab}.detail-main-image:active{cursor:grabbing}.detail-gallery-nav{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 12px;pointer-events:none}.detail-gallery-nav button{pointer-events:auto;width:38px;height:38px;border:0;border-radius:50%;background:#f3f3f1dd;color:#111;font-size:22px;cursor:pointer;display:grid;place-items:center}.detail-gallery-count{position:absolute;right:14px;bottom:14px;background:#111c;color:#fff;padding:7px 10px;font-size:9px;letter-spacing:1px}.detail-info{padding:20px 0;max-width:480px}.detail-info h1{font:900 clamp(48px,6vw,78px)/.84 var(--display);letter-spacing:-1.5px;margin:0 0 20px}.detail-info .eyebrow{color:#888}.detail-description{font-size:11px;color:#777;line-height:1.8;margin:0 0 30px}.detail-option{border-top:1px solid #ccc;padding:18px 0}.detail-option>label{display:flex;justify-content:space-between;font-size:9px;letter-spacing:1.2px;font-weight:700}.detail-option>label b{color:#777}.detail-choice-list{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.detail-choice{border:1px solid #bbb;background:transparent;padding:11px 15px;font-size:9px;font-weight:700;cursor:pointer}.detail-choice.active,.detail-choice.available{background:#111;color:#fff;border-color:#111}.detail-choice:disabled{color:#aaa;text-decoration:line-through;background:#e8e8e5;cursor:not-allowed}.detail-stock{font-size:10px;line-height:1.7;color:#777;margin:8px 0 22px}.detail-whatsapp{width:100%;min-height:54px;background:#111;color:#fff;border:1px solid #111;font-size:9px;font-weight:700;letter-spacing:1.2px;cursor:pointer}.detail-whatsapp:hover{background:#333}.detail-price{font-size:14px;font-weight:700;margin:0 0 18px;display:flex;align-items:center;gap:10px}.detail-price del{font-size:11px;color:#999;font-weight:500}.detail-loading{padding:100px 10px;text-align:center;color:#777;font-size:12px}.detail-error{text-align:center;padding:90px 20px}.detail-error h1{font:900 50px var(--display)}
    @media(max-width:760px){.details-page-header{height:68px;padding:0 6%}.product-detail-page{padding:20px 6% 65px}.detail-page-layout{grid-template-columns:1fr;gap:25px}.detail-info{padding:0}.detail-info h1{font-size:58px}.details-page-header span{font-size:7px}}
  </style>
</head>
<body>
  <header class="details-page-header"><a href="index.html">L&amp;G<small>STORE</small></a><span>DETALHES DO PRODUTO</span></header>
  <main id="product-detail" class="product-detail-page"><div class="detail-loading">CARREGANDO PRODUTO...</div></main>
  <script>
    const WHATSAPP_NUMBER = "5511958593868";
    const params = new URLSearchParams(window.location.search);
    const productId = params.get("id");
    const root = document.getElementById("product-detail");
    const money = value => new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"}).format(Number(value)||0);
    const safe = value => String(value ?? "").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
    let chosenColor = "";
    let chosenImage = "";
    let currentImageIndex = 0;
    let product = null;
    let productImages = [];
    function imageForColor(color){
      const colors=product.colors||[];
      const index=Math.max(0,colors.indexOf(color));
      return productImages[index]||product.image||productImages[0]||"";
    }
    function showImage(index){
      if(!productImages.length)return;
      currentImageIndex=(index+productImages.length)%productImages.length;
      chosenImage=productImages[currentImageIndex];
      const matchingColor=(product.colors||[])[currentImageIndex];
      if(matchingColor)chosenColor=matchingColor;
      const image=document.getElementById("detail-main-image");
      image.src=chosenImage;
      image.alt=product.name+(chosenColor?" — "+chosenColor:"");
      const colorLabel=document.getElementById("detail-selected-color");
      if(colorLabel)colorLabel.textContent=chosenColor.toUpperCase();
      document.querySelectorAll("[data-color]").forEach(button=>button.classList.toggle("active",button.dataset.color===chosenColor));
      const counter=document.getElementById("detail-gallery-count");
      if(counter)counter.textContent=String(currentImageIndex+1).padStart(2,"0")+" / "+String(productImages.length).padStart(2,"0");
      const navigation=document.querySelector(".detail-gallery-nav");
      if(navigation)navigation.hidden=productImages.length<2;
    }
    function setColor(color){
      chosenColor=color;
      const index=(product.colors||[]).indexOf(color);
      showImage(index>=0?index:currentImageIndex);
    }
    function render(){
      if(!product){root.innerHTML='<div class="detail-error"><h1>PRODUTO NÃO ENCONTRADO.</h1><p>Volte à loja e escolha outro produto.</p><a class="button button-dark" href="index.html#novidades">VOLTAR À LOJA ↗</a></div>';return;}
      const colors=product.colors||["Preta","Vermelha"];
      productImages=(product.images||[product.image]).filter(Boolean);
      chosenColor=colors[0];
      currentImageIndex=0;
      chosenImage=imageForColor(chosenColor);
      document.title=product.name+" — L&G STORE";
      root.innerHTML=`<button class="details-back" id="detail-back">← VOLTAR À LOJA</button><div class="detail-page-layout"><div class="detail-gallery" id="detail-gallery"><img id="detail-main-image" class="detail-main-image" src="${safe(chosenImage)}" alt="${safe(product.name)} — ${safe(chosenColor)}" draggable="false"><div class="detail-gallery-nav" hidden><button type="button" id="detail-prev" aria-label="Imagem anterior">‹</button><button type="button" id="detail-next" aria-label="Próxima imagem">›</button></div><span class="detail-gallery-count" id="detail-gallery-count">01 / ${String(productImages.length).padStart(2,"0")}</span></div><section class="detail-info"><p class="eyebrow dark-eyebrow">L&amp;G STORE / SELEÇÃO</p><h1>${safe(product.name)}</h1><p class="detail-description">${safe(product.description||"Escolha a cor e confira a disponibilidade de tamanho.")}</p>${product.price?'<p class="detail-price">'+(product.originalPrice?'<del>'+money(product.originalPrice)+'</del> ':'')+'<strong>'+money(product.price)+'</strong></p>':""}<div class="detail-option"><label>COR <b id="detail-selected-color">${safe(chosenColor.toUpperCase())}</b></label><div class="detail-choice-list">${colors.map((color,index)=>`<button class="detail-choice ${index===0?"active":""}" type="button" data-color="${safe(color)}">${safe(color)}</button>`).join("")}</div></div><div class="detail-option"><label>TAMANHO <b>G DISPONÍVEL</b></label><div class="detail-choice-list">${(product.sizes||["P","M","G","GG"]).map(size=>`<button class="detail-choice ${size==="G"?"available":""}" type="button" ${size==="G"?"":"disabled"}>${safe(size)}${size==="G"?"":" · ESGOTADO"}</button>`).join("")}</div></div><p class="detail-stock">Disponível somente no tamanho G. Os tamanhos P, M e GG estão esgotados.</p><button class="detail-whatsapp" id="detail-buy" type="button">COMPRAR PELO WHATSAPP ↗</button></section></div>`;
      document.getElementById("detail-back").addEventListener("click",()=>{window.location.href="index.html#novidades";});
      document.querySelectorAll("[data-color]").forEach(button=>button.addEventListener("click",()=>setColor(button.dataset.color)));
      showImage(0);
      document.getElementById("detail-prev").addEventListener("click",()=>showImage(currentImageIndex-1));
      document.getElementById("detail-next").addEventListener("click",()=>showImage(currentImageIndex+1));
      const gallery=document.getElementById("detail-gallery");
      let touchStartX=0;
      gallery.addEventListener("touchstart",event=>{touchStartX=event.changedTouches[0].clientX;},{passive:true});
      gallery.addEventListener("touchend",event=>{const delta=event.changedTouches[0].clientX-touchStartX;if(Math.abs(delta)>45)showImage(currentImageIndex+(delta<0?1:-1));},{passive:true});
      let pointerStartX=null;
      gallery.addEventListener("pointerdown",event=>{if(event.pointerType!=="touch")pointerStartX=event.clientX;});
      gallery.addEventListener("pointerup",event=>{if(pointerStartX===null)return;const delta=event.clientX-pointerStartX;pointerStartX=null;if(Math.abs(delta)>55)showImage(currentImageIndex+(delta<0?1:-1));});
      document.getElementById("detail-buy").addEventListener("click",()=>{
        const photoUrl=new URL(chosenImage,window.location.href).href;
        const message="Olá! Tenho interesse na "+product.name+", cor "+chosenColor+", tamanho G.\nFoto do produto escolhido: "+photoUrl+"\nA peça ainda está disponível?";
        window.open("https://wa.me/"+WHATSAPP_NUMBER+"?text="+encodeURIComponent(message),"_blank","noopener");
      });
    }
    fetch("products.json",{cache:"no-store"}).then(response=>{if(!response.ok)throw new Error("Falha ao carregar");return response.json();}).then(items=>{product=items.find(item=>String(item.id)===String(productId));render();}).catch(()=>{root.innerHTML='<div class="detail-error"><h1>NÃO FOI POSSÍVEL CARREGAR.</h1><a href="index.html#novidades">VOLTAR À LOJA</a></div>';});
  </script>
</body>
</html>
