<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f3f1">
  <meta name="description" content="Detalhes do produto — L&G STORE.">
  <title>Detalhes do produto — L&G STORE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
  <style>
    body{min-height:100vh}.details-page-header{height:76px;padding:0 8%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.details-page-header a:first-child{font:900 34px/.8 var(--display);letter-spacing:-2px}.details-page-header small{display:block;font:700 8px var(--body);letter-spacing:4px;margin-top:6px}.details-page-header span{font-size:8px;letter-spacing:1.5px;color:#777}.details-header-actions{display:flex;align-items:center;gap:22px}.detail-bag-trigger{border:1px solid #111;background:#111;color:#fff;padding:12px 16px;font:700 9px var(--body);letter-spacing:1px;cursor:pointer}.detail-bag-trigger b{margin-left:6px}.product-detail-page{padding:28px 8% 90px}.details-back{border:0;background:none;padding:10px 0 25px;font:700 9px var(--body);letter-spacing:1px;cursor:pointer}.detail-page-layout{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(300px,.85fr);gap:6%;align-items:start}.detail-main-image{width:100%;aspect-ratio:4/4.7;object-fit:cover;background:#ddd;display:block}.detail-gallery{position:relative;overflow:hidden;touch-action:pan-y;user-select:none}.detail-main-image{cursor:grab}.detail-main-image:active{cursor:grabbing}.detail-gallery-nav{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 12px;pointer-events:none}.detail-gallery-nav button{pointer-events:auto;width:38px;height:38px;border:0;border-radius:50%;background:#f3f3f1dd;color:#111;font-size:22px;cursor:pointer;display:grid;place-items:center}.detail-gallery-count{position:absolute;right:14px;bottom:14px;background:#111c;color:#fff;padding:7px 10px;font-size:9px;letter-spacing:1px}.detail-info{padding:20px 0;max-width:480px}.detail-info h1{font:900 clamp(48px,6vw,78px)/.84 var(--display);letter-spacing:-1.5px;margin:0 0 20px}.detail-info .eyebrow{color:#888}.detail-description{font-size:11px;color:#777;line-height:1.8;margin:0 0 30px}.detail-option{border-top:1px solid #ccc;padding:18px 0}.detail-option>label{display:flex;justify-content:space-between;font-size:9px;letter-spacing:1.2px;font-weight:700}.detail-option>label b{color:#777}.detail-choice-list{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.detail-choice{border:1px solid #bbb;background:transparent;padding:11px 15px;font-size:9px;font-weight:700;cursor:pointer}.detail-choice.active,.detail-choice.available{background:#111;color:#fff;border-color:#111}.detail-choice:disabled{color:#aaa;text-decoration:line-through;background:#e8e8e5;cursor:not-allowed}.detail-stock{font-size:10px;line-height:1.7;color:#777;margin:8px 0 22px}.detail-whatsapp{width:100%;min-height:54px;background:#111;color:#fff;border:1px solid #111;font-size:9px;font-weight:700;letter-spacing:1.2px;cursor:pointer}.detail-whatsapp:hover{background:#333}.detail-add-bag{width:100%;min-height:54px;margin:0 0 10px;background:transparent;color:#111;border:1px solid #111;font-size:9px;font-weight:700;letter-spacing:1.2px;cursor:pointer}.detail-add-bag:hover{background:#ddd}.detail-bag-drawer{position:fixed;z-index:60;right:0;top:0;height:100dvh;width:min(460px,100%);background:var(--paper);padding:30px;display:flex;flex-direction:column;transform:translateX(105%);transition:transform .3s ease}.detail-bag-drawer.open{transform:translateX(0)}.detail-bag-backdrop{position:fixed;inset:0;background:#0008;z-index:50;opacity:0;visibility:hidden;transition:.3s}.detail-bag-backdrop.visible{opacity:1;visibility:visible}.detail-bag-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid #ccc;padding-bottom:20px}.detail-bag-head h2{font:900 38px var(--display);margin:0}.detail-bag-items{flex:1;overflow:auto;padding:20px 0}.detail-bag-row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #ddd;padding:13px 0;font-size:11px}.detail-bag-row button{border:0;background:none;text-decoration:underline;font-size:9px;cursor:pointer}.detail-bag-footer{border-top:1px solid #ccc;padding-top:18px}.detail-bag-total{display:flex;justify-content:space-between;margin-bottom:18px;font-size:10px;letter-spacing:1px}.detail-bag-checkout{width:100%;min-height:48px;background:#111;color:#fff;border:0;font-size:9px;font-weight:700;letter-spacing:1px;cursor:pointer}.detail-bag-checkout:disabled{opacity:.4;cursor:not-allowed}.detail-bag-note{text-align:center;color:#888;font-size:9px;margin-top:12px}.detail-added-note{font-size:10px;color:#555;margin:0 0 10px}.detail-price{font-size:14px;font-weight:700;margin:0 0 22px;display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap}.detail-real,.detail-promo{display:flex;flex-direction:column;gap:5px}.detail-real small,.detail-promo small{font-size:8px;letter-spacing:1.2px;font-weight:700;color:#777}.detail-price del{font-size:13px;color:#888;font-weight:500}.detail-price strong{font-size:25px;line-height:1;color:#111;font-weight:900}.detail-promo{padding:10px 13px;background:#111;color:#fff}.detail-promo small{color:#c5c5c5}.detail-promo strong{color:#fff}.detail-rating{margin:-12px 0 26px;padding:0 0 18px;border-bottom:1px solid #e2e2df}.detail-rating-title{display:block;margin-bottom:9px;font-size:8px;font-weight:700;letter-spacing:1.35px;color:#777}.detail-rating-stars{display:flex;align-items:center;gap:4px}.detail-rating-star{width:27px;height:27px;padding:0;border:0;background:transparent;color:#c8c8c4;font-size:24px;line-height:1;cursor:pointer;transition:color .15s,transform .15s}.detail-rating-star.active,.detail-rating-star:hover{color:#111}.detail-rating-star:focus-visible{outline:1px solid #111;outline-offset:2px}.detail-rating-feedback{margin:7px 0 0;font-size:9px;color:#777;letter-spacing:.2px;min-height:13px}.detail-loading{padding:100px 10px;text-align:center;color:#777;font-size:12px}.detail-error{text-align:center;padding:90px 20px}.detail-error h1{font:900 50px var(--display)}
    @media(max-width:760px){.details-page-header{height:68px;padding:0 6%}.details-header-actions{gap:8px}.details-page-header span{display:none}.detail-bag-trigger{padding:10px 11px;font-size:8px}.detail-bag-drawer{padding:23px}.product-detail-page{padding:20px 6% 65px}.detail-page-layout{grid-template-columns:1fr;gap:25px}.detail-info{padding:0}.detail-info h1{font-size:58px}.details-page-header span{font-size:7px}}
  </style>
</head>
<body>
  <header class="details-page-header"><a href="index.html">L&amp;G<small>STORE</small></a><div class="details-header-actions"><span>DETALHES DO PRODUTO</span><button class="detail-bag-trigger" id="detail-bag-open" type="button">SACOLA <b id="detail-bag-count">0</b></button></div></header>
  <main id="product-detail" class="product-detail-page"><div class="detail-loading">CARREGANDO PRODUTO...</div></main>
  <section class="detail-bag-drawer" id="detail-bag" aria-label="Sacola de compras"><div class="detail-bag-head"><div><p class="eyebrow dark-eyebrow">SUA SELEÇÃO</p><h2>SUA SACOLA<span>.</span></h2></div><button class="close-button" id="detail-bag-close" type="button" aria-label="Fechar sacola">✕</button></div><div class="detail-bag-items" id="detail-bag-items"><p class="bag-empty">Sua sacola está vazia.</p></div><div class="detail-bag-footer"><div class="detail-bag-total"><span>SUBTOTAL</span><strong id="detail-bag-total">R$ 0,00</strong></div><button class="detail-bag-checkout" id="detail-bag-checkout" type="button" disabled>FINALIZAR PELO INSTAGRAM ↗</button><p class="detail-bag-note">Copie os detalhes do pedido e envie pelo Direct do Instagram.</p></div></section><div class="detail-bag-backdrop" id="detail-bag-backdrop"></div>
  <script>
    const INSTAGRAM_DM_URL = "https://ig.me/m/lgstore.20.26";
    function openInstagramWithMessage(message){window.open(INSTAGRAM_DM_URL,"_blank","noopener");if(navigator.clipboard?.writeText)navigator.clipboard.writeText(message).catch(()=>{});}
    const SUPABASE_URL = "https://ddbhgmwiovvmiopsfrdk.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_8CFQePirZ6VSBACCW0tTZA_q-u2yrZd";
    const SUPABASE_HEADERS = {"apikey":SUPABASE_PUBLISHABLE_KEY,"Authorization":"Bearer "+SUPABASE_PUBLISHABLE_KEY};
    function getReviewerKey(){
      const keyName="lg-store-reviewer-v1";
      let key=localStorage.getItem(keyName);
      if(!key){key=crypto.randomUUID();localStorage.setItem(keyName,key);}
      return key;
    }
    const params = new URLSearchParams(window.location.search);
    const productId = params.get("id");
    const root = document.getElementById("product-detail");
    const money = value => new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"}).format(Number(value)||0);
    const safe = value => String(value ?? "").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
    let chosenColor = "";
    let chosenImage = "";
    let currentImageIndex = 0;
    let product = null;
    let productImages = [];
    let chosenSize = "G";
    const CART_KEY = "lg-store-cart";
    let cart = readCart();
    function readCart(){try{return JSON.parse(localStorage.getItem(CART_KEY)||"[]")}catch{return []}}
    function saveCart(){localStorage.setItem(CART_KEY,JSON.stringify(cart));renderBag()}
    function renderBag(){
      const count=cart.reduce((sum,item)=>sum+Number(item.quantity||0),0);
      document.getElementById("detail-bag-count").textContent=count;
      const items=document.getElementById("detail-bag-items");
      items.innerHTML=cart.length?cart.map((item,index)=>`<div class="detail-bag-row"><div><strong>${safe(item.name)}</strong><p>${safe(item.color||"")} · Tam. ${safe(item.size||"")} · Qtd: ${item.quantity}</p></div><div><strong>${money(item.price*item.quantity)}</strong><br><button type="button" data-bag-remove="${index}">REMOVER</button></div></div>`).join(""):`<p class="bag-empty">Sua sacola está vazia.</p>`;
      document.getElementById("detail-bag-total").textContent=money(cart.reduce((sum,item)=>sum+Number(item.price||0)*Number(item.quantity||0),0));
      document.getElementById("detail-bag-checkout").disabled=!cart.length;
      items.querySelectorAll("[data-bag-remove]").forEach(button=>button.addEventListener("click",()=>{cart.splice(Number(button.dataset.bagRemove),1);saveCart()}));
    }
    function openBag(){document.getElementById("detail-bag").classList.add("open");document.getElementById("detail-bag-backdrop").classList.add("visible")}
    function closeBag(){document.getElementById("detail-bag").classList.remove("open");document.getElementById("detail-bag-backdrop").classList.remove("visible")}
    function checkoutBag(){if(!cart.length)return;const lines=cart.map(item=>`• ${item.name} | Cor: ${item.color} | Tamanho: ${item.size} | Qtd: ${item.quantity} | ${money(item.price*item.quantity)}`);const total=cart.reduce((sum,item)=>sum+Number(item.price||0)*Number(item.quantity||0),0);const message=`Olá! Vim pelo site da L&G STORE e gostaria de fazer este pedido:\n\n${lines.join("\n")}\n\n*Subtotal: ${money(total)}*\n\nPodem me informar as opções de pagamento e entrega?`;openInstagramWithMessage(message)}
    window.addEventListener("storage",event=>{if(event.key===CART_KEY){cart=readCart();renderBag()}});
    document.getElementById("detail-bag-open").addEventListener("click",openBag);
    document.getElementById("detail-bag-close").addEventListener("click",closeBag);
    document.getElementById("detail-bag-backdrop").addEventListener("click",closeBag);
    document.getElementById("detail-bag-checkout").addEventListener("click",checkoutBag);
    renderBag();
    function imageForColor(color){
      const colors=product.colors||[];
      const index=Math.max(0,colors.indexOf(color));
      return productImages[index]||product.image||productImages[0]||"";
    }
    function showImage(index){
      if(!productImages.length)return;
      currentImageIndex=(index+productImages.length)%productImages.length;
      chosenImage=productImages[currentImageIndex];
      const matchingColor=(product.colors||[])[currentImageIndex];
      if(matchingColor)chosenColor=matchingColor;
      const image=document.getElementById("detail-main-image");
      image.src=chosenImage;
      image.alt=product.name+(chosenColor?" — "+chosenColor:"");
      const colorLabel=document.getElementById("detail-selected-color");
      if(colorLabel)colorLabel.textContent=chosenColor.toUpperCase();
      document.querySelectorAll("[data-color]").forEach(button=>button.classList.toggle("active",button.dataset.color===chosenColor));
      const counter=document.getElementById("detail-gallery-count");
      if(counter)counter.textContent=String(currentImageIndex+1).padStart(2,"0")+" / "+String(productImages.length).padStart(2,"0");
      const navigation=document.querySelector(".detail-gallery-nav");
      if(navigation)navigation.hidden=productImages.length<2;
    }
    function setColor(color){
      chosenColor=color;
      const index=(product.colors||[]).indexOf(color);
      showImage(index>=0?index:currentImageIndex);
    }
    function render(){
      if(!product){root.innerHTML='<div class="detail-error"><h1>PRODUTO NÃO ENCONTRADO.</h1><p>Volte à loja e escolha outro produto.</p><a class="button button-dark" href="index.html#novidades">VOLTAR À LOJA ↗</a></div>';return;}
      const colors=product.colors||["Preta","Vermelha"];
      const availableSizes=product.availableSizes||["G"];
      productImages=(product.images||[product.image]).filter(Boolean);
      chosenColor=colors[0];
      currentImageIndex=0;
      chosenImage=imageForColor(chosenColor);
      document.title=product.name+" — L&G STORE";
      root.innerHTML=`<button class="details-back" id="detail-back">← VOLTAR À LOJA</button><div class="detail-page-layout"><div class="detail-gallery" id="detail-gallery"><img id="detail-main-image" class="detail-main-image" src="${safe(chosenImage)}" alt="${safe(product.name)} — ${safe(chosenColor)}" draggable="false"><div class="detail-gallery-nav" hidden><button type="button" id="detail-prev" aria-label="Imagem anterior">‹</button><button type="button" id="detail-next" aria-label="Próxima imagem">›</button></div><span class="detail-gallery-count" id="detail-gallery-count">01 / ${String(productImages.length).padStart(2,"0")}</span></div><section class="detail-info"><p class="eyebrow dark-eyebrow">L&amp;G STORE / SELEÇÃO</p><h1>${safe(product.name)}</h1><p class="detail-description">${safe(product.description||"Escolha a cor e confira a disponibilidade de tamanho.")}</p><div class="detail-rating" aria-label="Avaliação do produto"><span class="detail-rating-title">AVALIE ESTE PRODUTO</span><div class="detail-rating-stars" id="detail-rating-stars" role="group" aria-label="Escolha uma nota de 1 a 5 estrelas">${[1,2,3,4,5].map(value=>`<button class="detail-rating-star" type="button" data-rating="${value}" aria-label="${value} ${value===1?"estrela":"estrelas"}" aria-pressed="false">★</button>`).join("")}</div><p class="detail-rating-feedback" id="detail-rating-feedback" aria-live="polite">Toque nas estrelas para avaliar.</p></div>${product.price?'<div class="detail-price">'+(product.originalPrice?'<span class="detail-real"><small>VALOR REAL</small><del>'+money(product.originalPrice)+'</del></span><span class="detail-promo"><small>VALOR PROMOCIONAL</small><strong>'+money(product.price)+'</strong></span>':'<span class="detail-promo"><small>VALOR</small><strong>'+money(product.price)+'</strong></span>')+'</div>':""}<div class="detail-option"><label>COR <b id="detail-selected-color">${safe(chosenColor.toUpperCase())}</b></label><div class="detail-choice-list">${colors.map((color,index)=>`<button class="detail-choice ${index===0?"active":""}" type="button" data-color="${safe(color)}">${safe(color)}</button>`).join("")}</div></div><div class="detail-option"><label>TAMANHO <b id="detail-size-status">SELECIONE</b></label><div class="detail-choice-list">${(product.sizes||["P","M","G","GG"]).map(size=>`<button class="detail-choice ${availableSizes.includes(size)?"available":""}" type="button" data-size="${safe(size)}" ${availableSizes.includes(size)?"":"disabled"}>${safe(size)}${availableSizes.includes(size)?"":" · ESGOTADO"}</button>`).join("")}</div></div><p class="detail-stock" id="detail-stock-note">${availableSizes.length?("Disponível nos tamanhos: "+availableSizes.join(", ")+"."):"Consulte a disponibilidade pelo Instagram."}</p><p class="detail-added-note" id="detail-added-note" hidden>Produto adicionado à sua sacola.</p><button class="detail-add-bag" id="detail-add-bag" type="button">ADICIONAR À SACOLA +</button><button class="detail-whatsapp" id="detail-buy" type="button">COMPRAR PELO INSTAGRAM ↗</button></section></div>`;
      const reviewerKey=getReviewerKey();
      const ratingButtons=[...document.querySelectorAll("[data-rating]")];
      const ratingFeedback=document.getElementById("detail-rating-feedback");
      const ratingTitle=document.querySelector(".detail-rating-title");
      let savedRating=0;
      function paintRating(value){
        ratingButtons.forEach(button=>{
          const active=Number(button.dataset.rating)<=value;
          button.classList.toggle("active",active);
          button.setAttribute("aria-pressed",String(Number(button.dataset.rating)===value));
        });
      }
      async function loadProductRatings(){
        try{
          const response=await fetch(SUPABASE_URL+"/rest/v1/product_reviews?select=rating,reviewer_key&product_id=eq."+encodeURIComponent(String(product.id)),{headers:SUPABASE_HEADERS,cache:"no-store"});
          if(!response.ok)throw new Error("Não foi possível consultar as avaliações.");
          const rows=await response.json();
          const count=rows.length;
          const average=count?rows.reduce((sum,row)=>sum+Number(row.rating||0),0)/count:0;
          ratingTitle.textContent=count?"AVALIAÇÃO DOS CLIENTES":"SEJA O PRIMEIRO A AVALIAR";
          ratingFeedback.textContent=count?("★ "+average.toFixed(1).replace(".",",")+" / 5 · "+count+" "+(count===1?"avaliação":"avaliações")):"Ainda não há avaliações.";
          const own=rows.find(row=>row.reviewer_key===reviewerKey);
          if(own){
            savedRating=Number(own.rating);
            paintRating(savedRating);
            ratingFeedback.textContent="SUA NOTA: "+savedRating+"/5 · "+(count?("MÉDIA "+average.toFixed(1).replace(".",",")+" · "+count+" "+(count===1?"avaliação":"avaliações")):"");
            ratingButtons.forEach(button=>button.disabled=true);
          }
        }catch(error){
          ratingFeedback.textContent="Não foi possível carregar as avaliações agora.";
        }
      }
      ratingButtons.forEach(button=>button.addEventListener("click",async()=>{
        if(savedRating)return;
        const rating=Number(button.dataset.rating);
        ratingButtons.forEach(item=>item.disabled=true);
        ratingFeedback.textContent="ENVIANDO SUA AVALIAÇÃO...";
        try{
          const response=await fetch(SUPABASE_URL+"/rest/v1/product_reviews",{method:"POST",headers:{...SUPABASE_HEADERS,"Content-Type":"application/json","Prefer":"return=minimal"},body:JSON.stringify({product_id:String(product.id),reviewer_key:reviewerKey,rating})});
          if(!response.ok){
            if(response.status===409){
              ratingFeedback.textContent="Este navegador já enviou uma avaliação para este produto.";
              await loadProductRatings();
              return;
            }
            throw new Error("Falha ao salvar a avaliação.");
          }
          savedRating=rating;
          paintRating(savedRating);
          ratingFeedback.textContent="OBRIGADO! SUA NOTA: "+savedRating+"/5";
          await loadProductRatings();
        }catch(error){
          ratingFeedback.textContent="Não foi possível salvar. Tente novamente.";
          ratingButtons.forEach(item=>item.disabled=false);
        }
      }));
      loadProductRatings();
      chosenSize=availableSizes[0]||"";
      document.querySelectorAll("[data-size]").forEach(button=>button.addEventListener("click",()=>{chosenSize=button.dataset.size;document.querySelectorAll("[data-size]").forEach(item=>item.classList.toggle("active",item===button));document.getElementById("detail-size-status").textContent="TAMANHO "+chosenSize;}));
      document.getElementById("detail-add-bag").addEventListener("click",()=>{if(!chosenSize){document.getElementById("detail-stock-note").textContent="Este produto está sem tamanho disponível no momento.";return;}const key=[product.id,chosenColor,chosenSize].join("|");const existing=cart.find(item=>item.key===key);if(existing)existing.quantity+=1;else cart.push({key,id:product.id,name:product.name,price:Number(product.price)||0,color:chosenColor,size:chosenSize,quantity:1,image:chosenImage});saveCart();document.getElementById("detail-added-note").hidden=false;openBag();});
      document.getElementById("detail-back").addEventListener("click",()=>{window.location.href="index.html#novidades";});
      document.querySelectorAll("[data-color]").forEach(button=>button.addEventListener("click",()=>setColor(button.dataset.color)));
      showImage(0);
      document.getElementById("detail-prev").addEventListener("click",()=>showImage(currentImageIndex-1));
      document.getElementById("detail-next").addEventListener("click",()=>showImage(currentImageIndex+1));
      const gallery=document.getElementById("detail-gallery");
      let touchStartX=0;
      gallery.addEventListener("touchstart",event=>{touchStartX=event.changedTouches[0].clientX;},{passive:true});
      gallery.addEventListener("touchend",event=>{const delta=event.changedTouches[0].clientX-touchStartX;if(Math.abs(delta)>45)showImage(currentImageIndex+(delta<0?1:-1));},{passive:true});
      let pointerStartX=null;
      gallery.addEventListener("pointerdown",event=>{if(event.pointerType!=="touch")pointerStartX=event.clientX;});
      gallery.addEventListener("pointerup",event=>{if(pointerStartX===null)return;const delta=event.clientX-pointerStartX;pointerStartX=null;if(Math.abs(delta)>55)showImage(currentImageIndex+(delta<0?1:-1));});
      document.getElementById("detail-buy").addEventListener("click",()=>{
        const photoUrl=new URL(chosenImage,window.location.href).href;
        const message="Olá! Tenho interesse na "+product.name+", cor "+chosenColor+", tamanho "+(chosenSize||"Único")+".\nFoto do produto escolhido: "+photoUrl+"\nA peça ainda está disponível?";
        openInstagramWithMessage(message);
      });
    }
    fetch("products.json",{cache:"no-store"}).then(response=>{if(!response.ok)throw new Error("Falha ao carregar");return response.json();}).then(items=>{product=items.find(item=>String(item.id)===String(productId));render();}).catch(()=>{root.innerHTML='<div class="detail-error"><h1>NÃO FOI POSSÍVEL CARREGAR.</h1><a href="index.html#novidades">VOLTAR À LOJA</a></div>';});
  </script>
</body>
</html>
